<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        Student Management System
    </h1>

    <!-- Add Student Form -->

    <div class="card mb-4">

        <div class="card-header bg-primary text-white">
             Edit Student details
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Student Name
                    </label>
                    <input type="hidden" name="id" value="{{student.id}}">
                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter student name"
                        value="{{ student.name }}"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ student.email }}"
                        placeholder="Enter email"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Course
                    </label>

                    <input
                        type="text"
                        name="course"
                        class="form-control"
                        placeholder="Enter course"
                        value="{{student.course}}"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    Edit Student

                </button>

            </form>

        </div>

    </div>


    

</div>

</body>

</html>
