<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        Student Management System
    </h1>

    <!-- Add Student Form -->

    <div class="card mb-4">

        <div class="card-header bg-primary text-white">
            Add New Student
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Student Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="Enter student name"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter email"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Course
                    </label>

                    <input
                        type="text"
                        name="course"
                        class="form-control"
                        placeholder="Enter course"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    Add Student

                </button>

            </form>

        </div>

    </div>


    <!-- Student List -->

    <div class="card">

        <div class="card-header bg-dark text-white">

            Student List

        </div>

        <div class="card-body">

            <table class="table table-bordered table-striped">

                <thead class="table-dark">

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody>

                    {% for student in students %}

                    <tr>

                        <td>
                            {{ student.id }}
                        </td>

                        <td>
                            {{ student.name }}
                        </td>

                        <td>
                            {{ student.email }}
                        </td>

                        <td>
                            {{ student.course }}
                        </td>

                        <td>

                            <a
                                href="{% url 'edit_student' student.id %}"
                                class="btn btn-sm btn-primary">

                                Edit

                            </a>

                            <a
                                href="{% url 'delete_student' student.id %}"
                                class="btn btn-sm btn-danger">

                                Delete

                            </a>

                        </td>

                    </tr>

                    {% empty %}

                    <tr>

                        <td colspan="5"
                            class="text-center">

                            No students found.

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
